# AID Web 用户端静态站点（Nuxt generate 产物）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # 静态资源长期缓存；带哈希的 Nuxt 资源文件名可安全缓存。
    location /_nuxt/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /__static__(/|$) { return 404; }
    # Existing static routes retain their HTML; missing routes are resolved at the gateway.
    location / {
        try_files $uri $uri/ =404;
    }
}
