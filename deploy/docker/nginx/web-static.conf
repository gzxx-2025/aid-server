# AID Web 用户端静态站点（Nuxt generate 产物）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # 静态资源长期缓存；带哈希的 Nuxt 资源文件名可安全缓存。
    location /_nuxt/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 动态/认证路由由 Nuxt 通用客户端入口接管，避免回退预渲染首页造成 hydration 冲突。
    location / {
        try_files $uri $uri/ /200.html;
    }
}
