# Runtime includes are persisted outside this installation template.
server {
    listen 80;
    server_name _;
    include /etc/nginx/aid-managed/public.conf;
    location = /healthz { access_log off; return 200 "ok"; }
    location / {
        proxy_pass http://aid-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @aid_public_page;
    }
}
server {
    listen 8090;
    server_name _;
    include /etc/nginx/aid-managed/admin.conf;
    root /usr/share/nginx/aid/admin-dist;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
